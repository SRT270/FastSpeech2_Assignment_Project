language: Telugu
dataset: IndicTTS Telugu
data:
  manifest_train: data/manifests/telugu_train.csv
  manifest_val: data/manifests/telugu_val.csv
  raw_path: data/raw/Telugu
  preprocessed_path: data/preprocessed/Telugu
  sample_rate: 22050
  min_duration: 2
  max_duration: 30
text:
  frontend: telugu_akshara_g2p
  cleaners:
  - telugu_unicode_normalization
  language_code: te
  symbol_inventory: telugu_phonetic_inventory
alignment:
  tool: MFA_OR_COMPATIBLE_TELUGU_ALIGNER
  required: true
  textgrid_tier: phones
  acoustic_model: indic_tts_telugu_acoustic_model
  dictionary: telugu_lexicon_phonetic
model:
  encoder_layers: 4
  encoder_heads: 2
  encoder_hidden: 256
  decoder_layers: 6
  decoder_heads: 2
  decoder_hidden: 256
  n_mel_channels: 80
  sampling_rate: 22050
  hop_length: 256
  filter_length: 1024
  win_length: 1024
  pitch_level: phoneme_level
  energy_level: phoneme_level
  multi_speaker: false
training:
  batch_size: 4
  total_steps: 100000
  warmup_steps: 4000
  save_every: 5000
  validate_every: 1000
  seed: 42
paths:
  checkpoint_dir: checkpoints
  results_dir: Results/Telugu
  vendor_dir: vendor/FastSpeech2
